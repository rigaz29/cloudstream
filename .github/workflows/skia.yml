name: Skia

# CloudStream Skia: follows upstream master, then builds and publishes the signed
# prerelease APK as the "pre-release" release that the in-app updater checks.

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'fastlane/**'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: skia
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    if: github.repository == 'rigaz29/cloudstream-skia' && github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream master
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # .gitattributes marks fork-owned files (README.md) with merge=ours: keep ours on conflicts.
          git config merge.ours.driver true
          git remote add upstream https://github.com/recloudstream/cloudstream.git
          git fetch --quiet upstream master

          OLD=$(git merge-base HEAD upstream/master)
          NEW=$(git rev-parse upstream/master)
          if [ "$OLD" = "$NEW" ]; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          open_issue() { # title, body file
            if [ -z "$(gh issue list --state open --search "\"$1\" in:title" --json number --jq '.[].number')" ]; then
              gh issue create --title "$1" --body-file "$2"
            else
              echo "An open issue already exists: $1"
            fi
          }

          DRIFT=0
          python3 scripts/skia/drift-check.py "$OLD" "$NEW" --markdown drift.md --fail-on-drift || DRIFT=$?

          if ! git merge --no-edit -m "Merge upstream master (${NEW:0:7})" upstream/master; then
            {
              echo "Merging upstream \`${NEW:0:7}\` into \`master\` conflicts in:"
              echo
              git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/'
              echo
              echo "Resolve locally: \`git fetch upstream && git merge upstream/master\`, then push."
            } > conflict.md
            git merge --abort
            open_issue "Upstream merge conflict" conflict.md
            exit 1
          fi

          # GITHUB_TOKEN may not push changes to workflow files; such merges need a manual push.
          if git diff --name-only HEAD^1 HEAD | grep -q '^\.github/workflows/'; then
            {
              echo "Upstream \`${NEW:0:7}\` changes GitHub workflow files, which this workflow is not"
              echo "allowed to push. Merge it locally: \`git fetch upstream && git merge upstream/master\`."
            } > manual.md
            open_issue "Upstream sync needs a manual merge" manual.md
            exit 1
          fi

          git push origin HEAD:master
          if [ "$DRIFT" = "2" ]; then
            open_issue "Upstream changed resources the fork overrides (${NEW:0:7})" drift.md
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: >-
      always() && github.repository == 'rigaz29/cloudstream-skia' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' && needs.sync.result == 'success' ||
       needs.sync.outputs.changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore signing key
        id: key
        env:
          SKIA_KEYSTORE_B64: ${{ secrets.SKIA_KEYSTORE_B64 }}
        run: |
          if [ -z "$SKIA_KEYSTORE_B64" ]; then
            echo "::warning::SKIA_KEYSTORE_B64 is not set; skipping the release build."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # app/build.gradle.kts reads the first file in <home>/work/_temp/keystore
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$SKIA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/skia.jks"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Build prerelease APK
        if: steps.key.outputs.ok == 'true'
        run: ./gradlew assemblePrereleaseRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SKIA_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SKIA_KEYSTORE_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SKIA_KEYSTORE_PASSWORD }}

      - name: Publish pre-release
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT=${SHA:0:7}
          # Fixed name so README can link the latest APK directly; the commit is in the notes.
          APK="CloudStream-Skia.apk"
          cp app/build/outputs/apk/prerelease/release/*.apk "$APK"

          gh release delete pre-release --yes --cleanup-tag || true
          # The tag must point at this build: the in-app updater compares it with the
          # app's commit. (The fork also inherited upstream's own pre-release tag.)
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/pre-release" || true
          gh release create pre-release --prerelease --target "$SHA" \
            --title "CloudStream Skia pre-release" \
            --notes "Built from ${SHORT} ($(git log -1 --format=%s | sed 's/"//g')) on $(date -u +%Y-%m-%d). Installs as com.lagradost.cloudstream3.skia, next to the official CloudStream apps. Android 6.0+, one APK for phones, tablets and Android TV."

          # Upload with an explicit content type: the in-app updater looks for it.
          UPLOAD_URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/pre-release" --jq '.upload_url' | sed 's/{.*}//')
          curl --fail -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" \
            "${UPLOAD_URL}?name=${APK}" > /dev/null
